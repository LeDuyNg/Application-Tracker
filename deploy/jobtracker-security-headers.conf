# /etc/nginx/snippets/jobtracker-security-headers.conf
#
# Response security headers for the *static* half of the site.
#
# Spring Security already sets nosniff, X-Frame-Options, HSTS and cache directives on
# everything it answers — /api, /oauth2, /login. What it cannot touch is index.html and the
# JS/CSS bundle, which Nginx serves from disk without the JVM ever seeing the request. Those
# were going out bare, which is what made the SPA framable.
#
# So this snippet is included ONLY in the static locations, not the proxied ones. Adding it
# at server level instead would double every header on the API responses — same values, but
# two Content-Security-Policy headers are enforced as their *intersection*, which is a
# genuinely confusing thing to debug later.
#
# ---------------------------------------------------------------------------------------
# THE TRAP: add_header does not merge. A location block containing any add_header of its own
# discards every add_header inherited from its parent — silently, with no warning and no
# error. `/assets/` and `= /index.html` both set Cache-Control, so they would lose all of
# this if it were only declared once at server level. That is why the include is repeated in
# each of them rather than hoisted, and why nothing here should be moved "up" to tidy it.
# ---------------------------------------------------------------------------------------
#
# `always` makes the header apply to error responses too, not just 2xx/3xx.

# Only meaningful over https, so this snippet belongs in the TLS server block. Deliberately
# without `preload`: preload submission is irreversible for the apex domain and this is a
# personal project on a domain that may get reused.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# frame-ancestors below is the modern control; this covers browsers that predate CSP3.
add_header X-Frame-Options "DENY" always;

add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content-Security-Policy, source by source — each entry is here because something in the
# app actually needs it, and the ones that are NOT here are the point of the exercise:
#
#   default-src 'self'      everything not named below is same-origin only.
#   script-src  'self'      the Vite build emits an external module bundle and zero inline
#                           <script> blocks (verified against dist/index.html), so no
#                           'unsafe-inline' and no nonce plumbing is needed. This is the
#                           line that matters most.
#   style-src   ...         'unsafe-inline' is required and is not laziness: the components
#                           use 74 inline `style={{…}}` attributes, and style-src governs
#                           style attributes as well as <style> blocks. Removing it means
#                           moving all 74 into theme.css first. Inline *style* injection is
#                           a far weaker vector than script, so this is an accepted gap
#                           rather than an unnoticed one. fonts.googleapis.com serves the
#                           Fraunces/Inter/JetBrains Mono stylesheet index.html links.
#   font-src    ...         fonts.gstatic.com is where that stylesheet then pulls the woff2.
#   img-src     ...         data: for inline SVG icons; googleusercontent for the Google
#                           profile picture rendered in the sidebar avatar.
#   connect-src 'self'      the SPA's api client only ever calls its own origin.
#   form-action 'self'      Google's OAuth flow returns via a GET redirect, not a form POST,
#                           so accounts.google.com does not need to be here.
#   frame-ancestors 'none'  nobody may frame this. The clickjacking fix.
#   base-uri 'self'         stops an injected <base> silently re-pointing every relative URL.
#   object-src 'none'       no <object>/<embed>; nothing in the app uses them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
