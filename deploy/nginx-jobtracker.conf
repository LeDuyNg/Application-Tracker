# /etc/nginx/sites-available/jobtracker  (symlink into sites-enabled/)
#
# Serves the React build as static files and proxies the API to the JVM on 127.0.0.1:8080.
# Written in Phase 3 for the two things that must not be deferred to Phase 4 — the
# X-Forwarded-* headers the OAuth flow depends on, and rate limiting — so `certbot --nginx`
# has something correct to edit rather than something being invented at deploy time.
#
# Response security headers for the static assets live in
# snippets/jobtracker-security-headers.conf and are included in each static location —
# see that file for why they are not declared once at server level.


# ---------------------------------------------------------------- rate limiting
#
# `limit_req_zone` is an http-context directive. Files under sites-enabled/ are `include`d
# from inside the http block, so declaring the zones here is valid — but it also means the
# zone names are global: do not reuse them in another vhost.
#
# The box is an Oracle E2.1.Micro: 1/8 OCPU baseline and 1 GB of RAM shared between Nginx,
# the OS and a JVM capped at -Xmx256m (CLAUDE.md §6). A request flood does not have to
# authenticate, or even be large, to take it down — which is why this is here despite the
# app having exactly one legitimate user, and why the limits are far below what a browser
# would ever need rather than merely "generous".
#
# 10m of shared memory holds ~160k addresses; nothing here will come close.

# Normal API traffic. The SPA's heaviest moment is the dashboard mounting four queries at
# once, so the burst matters more than the rate.
limit_req_zone $binary_remote_addr zone=jt_api:10m rate=10r/s;

# The login path, held much tighter: a browser hits it once per sign-in, and it is the only
# unauthenticated surface that does real work (a token exchange with Google).
limit_req_zone $binary_remote_addr zone=jt_auth:10m rate=1r/s;

# Concurrent connections, which a slow-read attack exhausts without tripping a rate limit.
limit_conn_zone $binary_remote_addr zone=jt_conn:10m;

# 503 is the Nginx default and reads as "the server broke". 429 is the true answer.
limit_req_status 429;
limit_conn_status 429;


server {
    listen 80;
    listen [::]:80;
    server_name app4jobtrack.me www.app4jobtrack.me;

    # certbot rewrites this block on first run and adds the certificate lines to the :443
    # servers below. Redirect to the apex, not $host: www must not survive the hop, for the
    # reason given on the canonical-redirect block below.
    return 301 https://app4jobtrack.me$request_uri;
}

# www over https, folded onto the apex.
#
# This block is load-bearing, not cosmetic. Without it `www` still resolves — it lands on
# the only :443 server, which nginx treats as the default — and the app answers on
# www.app4jobtrack.me. Spring then builds the OAuth redirect_uri from the Host header as
# https://www.app4jobtrack.me/login/oauth2/code/google, Google compares it to the apex URI
# registered in the console, and login fails with redirect_uri_mismatch. Same failure shape
# as a missing X-Forwarded-Proto: not a degradation, a hard stop, and only on the www
# hostname, so it survives every test done on the apex.
#
# certbot must therefore be run with -d for BOTH names, or this block has no certificate.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.app4jobtrack.me;

    # ssl_certificate / ssl_certificate_key are filled in by `certbot --nginx`.

    return 301 https://app4jobtrack.me$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app4jobtrack.me;

    # ssl_certificate / ssl_certificate_key are filled in by `certbot --nginx`.

    root /var/www/jobtracker;
    index index.html;

    # The largest request the API accepts is an application with 50 stages — tens of KB.
    # Nginx's 1m default is an invitation to stream megabytes at a 256 MB heap.
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    limit_conn jt_conn 20;

    # ------------------------------------------------------------ static SPA
    location / {
        # Client-side routing: /applications/abc123 is a React route, not a file, so
        # anything that is not a real file falls back to index.html.
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/jobtracker-security-headers.conf;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        # One Cache-Control, not two. `expires 1y` generates a Cache-Control header of its
        # own, and add_header *appends* rather than replaces — together they emit the header
        # twice with different values, which is ambiguous and was visible in testing. The
        # single add_header says everything `expires` would have.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repeated, not inherited: this block's own add_header above discards every
        # add_header from the parent. See the snippet's header comment.
        include /etc/nginx/snippets/jobtracker-security-headers.conf;
    }

    # index.html must never be cached, or a deploy leaves browsers loading a stale bundle
    # that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
        # Same reason as /assets/ — the Cache-Control above would otherwise drop these.
        include /etc/nginx/snippets/jobtracker-security-headers.conf;
    }

    # ------------------------------------------------------------ the API
    location /api/ {
        limit_req zone=jt_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/jobtracker-proxy.conf;
    }

    # ------------------------------------------- OAuth: start, and Google's callback
    #
    # Both are rate-limited harder than /api. `burst=10` rather than `nodelay` so a
    # double-click queues instead of being rejected mid-login.
    location /oauth2/ {
        limit_req zone=jt_auth burst=10;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/jobtracker-proxy.conf;
    }

    location /login/ {
        limit_req zone=jt_auth burst=10;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/jobtracker-proxy.conf;
    }

    # /actuator is deliberately NOT proxied. The health endpoint is permitAll in
    # SecurityConfig so the systemd/deploy smoke check can reach it on 127.0.0.1:8080
    # directly; there is no reason for it to be on the public internet.
}
