# /etc/nginx/snippets/jobtracker-proxy.conf
#
# The proxy headers, in one file, because getting them right is load-bearing and getting
# them subtly different between three location blocks is how they drift.
#
# X-Forwarded-Proto is the important one. Nginx terminates TLS, so the request that reaches
# Spring on 127.0.0.1:8080 is plain http. Without this header (and
# `server.forward-headers-strategy: framework`, already set in application-prod.yml)
# `request.isSecure()` is false inside the app, and three things follow:
#
#   1. Spring Security builds the OAuth `redirect_uri` as http://app4jobtrack.me/... —
#      Google compares it against the registered https URI, sees a mismatch, and refuses.
#      Login does not degrade, it fails outright.
#   2. The Strict-Transport-Security header is suppressed.
#   3. CookieCsrfTokenRepository defaults its `secure` flag from request.isSecure(), so
#      XSRF-TOKEN ships without Secure and will travel over plain http.
#
# Host must be passed through as well: Spring builds the redirect_uri from it, and Nginx's
# default would send the upstream literal `127.0.0.1:8080`.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

proxy_http_version 1.1;
proxy_read_timeout 30s;
proxy_connect_timeout 5s;

# Nginx serves the error pages for a rate-limited request itself; do not let a 429 from
# here be confused with one from the app.
proxy_intercept_errors off;
